<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הזדהות לדשבורד</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #0f172a, #111827 50%, #1f2937); color: #e2e8f0; font-family: Arial, sans-serif; }
    .card { width: min(440px, calc(100vw - 32px)); background: rgba(15,23,42,0.9); border: 1px solid rgba(148,163,184,0.25); border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(15,23,42,0.4); }
    h1 { margin: 0 0 8px; text-align: center; }
    p { margin: 0 0 20px; text-align: center; color: #cbd5e1; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 8px; color: #cbd5e1; }
    input { padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.8); color: #f8fafc; }
    button { border: none; border-radius: 10px; padding: 12px 16px; background: linear-gradient(135deg, #60a5fa, #2563eb); color: white; font-weight: 700; cursor: pointer; }
    .error { display: none; margin-top: 8px; color: #fca5a5; font-size: 0.92rem; min-height: 20px; }
    .note { margin-top: 16px; text-align: center; color: #94a3b8; font-size: 0.82rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>הזדהות לדשבורד</h1>
    <p>הגישה מוגנת. נדרשת התחברות עם חשבון מאושר.</p>

    <form id="dashboard-login-form" novalidate>
      <label>
        אימייל
        <input id="dashboard-email" type="email" autocomplete="email" required placeholder="you@company.com" />
      </label>

      <label>
        סיסמה
        <input id="dashboard-password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </label>

      <div id="dashboard-auth-error" class="error" aria-live="polite"></div>
      <button id="dashboard-login-btn" type="submit">התחברות</button>
    </form>

    <div class="note">גישה ניתנת רק לחשבונות מאושרים ב-Supabase.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/dashboard/js/config.js"></script>
  <script src="/dashboard/js/auth.js"></script>
</body>
</html>
