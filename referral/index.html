<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referral redirect</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: #0f172a;
      }
      .card {
        width: min(92vw, 440px);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #4f46e5;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: #334155;
      }
      .meta {
        font-size: 13px;
        color: #475569;
        margin-bottom: 18px;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: #4f46e5;
        color: white;
      }
      .btn-secondary {
        background: rgba(15, 23, 42, 0.06);
        color: #0f172a;
      }
      .muted {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Me-Kum referral</div>
      <h1>Opening the right store...</h1>
      <p>This page chooses the correct store for the device, and keeps the referral language in the query string for first-open bootstrap.</p>
      <div class="meta" id="meta"></div>
      <div class="actions">
        <a id="storeLink" class="btn btn-primary" href="#">Continue</a>
        <a class="btn btn-secondary" href="/">Back to site</a>
      </div>
      <div class="muted" id="fallback"></div>
    </main>

    <script>
      const IOS_STORE_URL = 'https://apps.apple.com/app/id6782772202';
      const ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.mekom.app';
      const params = new URLSearchParams(window.location.search);
      const lang = params.get('lang') === 'he' ? 'he' : 'en';
      const code = params.get('code') || '';
      const src = params.get('src') || 'referral';
      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isiOS = /iPhone|iPad|iPod/i.test(ua);
      const storeUrl = isAndroid ? ANDROID_STORE_URL : IOS_STORE_URL;
      const storeLink = document.getElementById('storeLink');
      const meta = document.getElementById('meta');
      const fallback = document.getElementById('fallback');

      const referralPayload = new URLSearchParams({ src, lang });
      if (code) referralPayload.set('code', code);
      const finalUrl = `${storeUrl}${storeUrl.includes('?') ? '&' : '?'}${referralPayload.toString()}`;

      storeLink.href = finalUrl;
      storeLink.textContent = isAndroid ? 'Open Google Play' : (isiOS ? 'Open App Store' : 'Open store');
      meta.textContent = `language=${lang} · source=${src}`;
      fallback.textContent = `Device detected: ${isAndroid ? 'Android' : (isiOS ? 'iOS' : 'unknown')} · ${finalUrl}`;

      window.setTimeout(() => {
        window.location.replace(finalUrl);
      }, 350);
    </script>
  </body>
</html>
