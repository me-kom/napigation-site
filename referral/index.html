<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מעבר לחנות</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: #0f172a;
      }
      .card {
        width: min(92vw, 440px);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: #334155;
      }
      .actions {
        display: flex;
        margin-top: 20px;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: #4f46e5;
        color: white;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">מעבירים אותך לחנות המתאימה...</h1>
      <p id="message">אם לא הועברת אוטומטית, לחץ על הכפתור כדי להגיע לחנות.</p>
      <div class="actions">
        <a id="storeLink" class="btn btn-primary" href="#">מעבר לחנות</a>
      </div>
    </main>

    <script>
      const IOS_STORE_URL = 'https://apps.apple.com/app/id6782772202';
      const ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.mekom.app';
      const params = new URLSearchParams(window.location.search);
      const lang = params.get('lang') === 'he' ? 'he' : 'en';
      const code = params.get('code') || '';
      const src = params.get('src') || 'referral';
      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      const isiOS = /iPhone|iPad|iPod/i.test(ua);
      const storeUrl = isAndroid ? ANDROID_STORE_URL : IOS_STORE_URL;
      const storeLink = document.getElementById('storeLink');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const isHebrew = lang === 'he';

      document.documentElement.lang = lang;
      document.title = isHebrew ? 'מעבר לחנות' : 'Opening the store';
      title.textContent = isHebrew
        ? 'מעבירים אותך לחנות המתאימה...'
        : 'Taking you to the right store...';
      message.textContent = isHebrew
        ? 'אם לא הועברת אוטומטית, לחץ על הכפתור כדי להגיע לחנות.'
        : "If you aren't redirected automatically, tap the button to open the store.";

      const referralPayload = new URLSearchParams({ src, lang });
      if (code) referralPayload.set('code', code);
      const payloadQuery = referralPayload.toString();
      const finalUrl = isAndroid
        ? `${ANDROID_STORE_URL}&referrer=${encodeURIComponent(payloadQuery)}`
        : `${storeUrl}${storeUrl.includes('?') ? '&' : '?'}${payloadQuery}`;
      const intentFallback = encodeURIComponent(finalUrl);
      const androidIntentUrl = `intent://referral?${payloadQuery}#Intent;scheme=mekom;package=com.mekom.app;S.browser_fallback_url=${intentFallback};end`;
      const destinationUrl = isAndroid ? androidIntentUrl : finalUrl;

      storeLink.href = destinationUrl;
      storeLink.textContent = isHebrew
        ? 'מעבר לחנות'
        : (isAndroid ? 'Open Google Play' : (isiOS ? 'Open the App Store' : 'Open the store'));

      window.setTimeout(() => {
        window.location.replace(destinationUrl);
      }, 350);
    </script>
  </body>
</html>
